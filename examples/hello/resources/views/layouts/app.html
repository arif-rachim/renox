<!doctype html>
<html lang="{{ app.locale }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ app.name }}{% endblock %}</title>
  <link rel="stylesheet" href="{{ asset('app.css') }}">
  {{ renox_head() }}
</head>
<body>
  <nav>
    <a href="{{ route('guestbook.index') }}"><strong>{{ app.name }}</strong></a>
    {% if auth.check %}
    <span>{{ auth.user.name }}</span>
    <form method="post" action="{{ route('logout') }}">{{ csrf_field() }}<button>{{ t('nav.logout') }}</button></form>
    {% else %}
    <a href="{{ route('login') }}">{{ t('nav.login') }}</a>
    <a href="{{ route('register') }}">{{ t('nav.register') }}</a>
    {% endif %}
    <span class="lang"><a href="{{ route('language', 'id') }}">ID</a> | <a href="{{ route('language', 'en') }}">EN</a></span>
  </nav>
  <main>
    {% if flash.status %}<p class="flash">{{ flash.status }}</p>{% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>

[package]
name = "uploads"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
renox.workspace = true
serde = { version = "1.0.229", features = ["derive"] }

[features]
# Files on S3 (or any S3-compatible store) instead of the local disk:
# `cargo run --features s3` with STORAGE_DISK=s3 and the S3_* settings.
s3 = ["renox/s3"]

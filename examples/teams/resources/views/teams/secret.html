{% extends "layouts/app.html" %}

{% block content %}
<h1>{{ team.name }}'s webhook secret</h1>
{% if secret %}
<p>Sign your webhooks with:</p>
<p><code id="secret">{{ secret }}</code></p>
{% else %}
<p class="muted">No secret yet.</p>
{% endif %}
<form method="post" action="{{ route('team.secret.rotate') }}">
  {{ csrf_field() }}<button>{{ "Replace it" if secret else "Make one" }}</button>
</form>
<p><a href="{{ route('team.settings') }}">Back to the team</a></p>
{% endblock %}

{#- The company's colour from the settings, as the kit's accent: buttons,
    links, focus rings, the brand mark. Rebranding the kit is overriding its
    tokens (docs/ui.md); the shades are mixed in the browser. `brand_color`
    is checked to be #rrggbb when saved. -#}
<style>
  :root {
    --rx-accent: {{ company.brand_color }};
    --rx-accent-hover: color-mix(in srgb, {{ company.brand_color }} 88%, white);
    --rx-accent-pressed: color-mix(in srgb, {{ company.brand_color }} 85%, black);
    --rx-accent-text: color-mix(in srgb, {{ company.brand_color }} 80%, black);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --rx-accent-text: color-mix(in srgb, {{ company.brand_color }} 55%, white); }
  }
  :root[data-theme="dark"] { --rx-accent-text: color-mix(in srgb, {{ company.brand_color }} 55%, white); }
</style>

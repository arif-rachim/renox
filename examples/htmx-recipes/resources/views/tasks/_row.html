<li id="task-{{ task.id }}" class="task{{ ' done' if task.done }}"
    x-show="tab === 'all' || tab === '{{ 'done' if task.done else 'open' }}'">
  {# Toggle in place: the answer is this row, re-rendered. #}
  <input type="checkbox" aria-label="Done" {% if task.done %}checked{% endif %}
         hx-patch="{{ route('tasks.toggle', task.id) }}" hx-target="closest li" hx-swap="outerHTML">
  {# Inline edit: double-click swaps the row for a small form. #}
  <span class="title" title="Double-click to edit"
        hx-get="{{ route('tasks.edit', task.id) }}" hx-trigger="dblclick" hx-target="closest li" hx-swap="outerHTML">{{ task.title }}</span>
  {# Dropdown menu (Alpine); delete swaps the row for nothing. #}
  <div class="menu" x-data="{ menu: false }" @click.outside="menu = false" @keydown.escape="menu = false">
    <button type="button" aria-label="Actions" :aria-expanded="menu" @click="menu = !menu">⋯</button>
    <div class="menu-items" x-show="menu" x-cloak>
      <button type="button" hx-get="{{ route('tasks.edit', task.id) }}" hx-target="closest li" hx-swap="outerHTML">Edit</button>
      <button type="button" hx-delete="{{ route('tasks.destroy', task.id) }}" hx-target="closest li" hx-swap="outerHTML"
              hx-confirm="Delete this task?">Delete</button>
    </div>
  </div>
</li>

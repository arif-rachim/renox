<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Products · API client</title>
  <link rel="stylesheet" href="/client.css">
  <script src="/client.js" defer></script>
</head>
<body>
  <!-- A front end that knows nothing of the server but its JSON API, like a
       mobile app or a single-page app: it logs in for a token
       (POST /api/tokens), keeps it in sessionStorage, and sends it as
       `Authorization: Bearer …` to every other call. -->
  <main>
    <h1>Products</h1>
    <p class="hint">A static page (public/client.html and client.js) calling the JSON API.</p>

    <form id="login" class="card">
      <h2>Log in</h2>
      <label>Email <input name="email" type="email" value="demo@example.com" autocomplete="username" required></label>
      <label>Password <input name="password" type="password" value="password123" autocomplete="current-password" required></label>
      <label class="check"><input name="read_only" type="checkbox"> Read-only token</label>
      <p class="error" data-error></p>
      <button>Get a token</button>
    </form>

    <section id="app" hidden>
      <div class="bar">
        <p id="who"></p>
        <button id="logout" class="quiet">Log out</button>
      </div>
      <form id="add" class="card">
        <h2>New product</h2>
        <label>Name <input name="name" required></label>
        <p class="error" data-error-for="name"></p>
        <label>Price <input name="price" type="number" min="0" required></label>
        <p class="error" data-error-for="price"></p>
        <p class="error" data-error></p>
        <button>Add</button>
      </form>
      <ul id="products" class="list"></ul>
      <button id="more" class="quiet" hidden>Load more</button>
    </section>
  </main>
</body>
</html>

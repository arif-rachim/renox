[package]
name = "renox-learn"
version.workspace = true
edition = "2024"
publish = false
description = "learn.renox.rs: a course that builds one Renox app stage by stage, built with Renox."

[dependencies]
renox.workspace = true
# The docs site's list of pages (links into the docs are checked against it).
renox-site = { path = "../site" }
pulldown-cmark = { version = "0.13.4", default-features = false, features = ["html"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tracing = "0.1.44"

[dev-dependencies]
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
# tests/editor_data.rs reads Renox's API and the stages' models from source
# (the versions the workspace already locks; no `span-locations`).
syn = { version = "3", features = ["full"] }
quote = "1.0.47"
proc-macro2 = "1.0.107"
heck = "0.5.0"

[workspace]
resolver = "3"
members = ["crates/*", "examples/*", "site", "tests/chaos"]

[workspace.package]
version = "1.0.0-rc.3"
edition = "2024"
# The oldest Rust that builds Renox (sqlx 0.9 needs 1.94); checked in CI.
rust-version = "1.94"
license = "MIT OR Apache-2.0"
repository = "https://github.com/arif-rachim/renox"
homepage = "https://github.com/arif-rachim/renox"
keywords = ["web", "framework", "htmx", "sqlite", "postgres"]
categories = ["web-programming::http-server"]

[workspace.dependencies]
# Released together, in lockstep: the macros write code against renox-core's
# items of the same release, so each crate pins the others exactly (`=`).
renox = { path = "crates/renox", version = "=1.0.0-rc.3" }
renox-core = { path = "crates/renox-core", version = "=1.0.0-rc.3", default-features = false }
renox-macros = { path = "crates/renox-macros", version = "=1.0.0-rc.3" }

# Password hashing (Argon2) is deliberately slow, and far slower unoptimised:
# every login, registration and auth test paid for it. Optimise just these
# crates in dev and test builds; the rest stays quick to compile.
# Line numbers in backtraces, without full debug info (as in apps made by
# `rnx new`): much smaller test binaries and lighter, faster links. Full debug
# info let a workspace build with 8 link jobs run a 15 GB machine out of memory.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package.argon2]
opt-level = 3

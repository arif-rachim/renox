[package]
name = "renox"
description = "A batteries-included web framework for Rust, inspired by Laravel: Axum + HTMX + Alpine.js + SQLite. (Early placeholder, work in progress.)"
readme = "../../README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = ["fake", "server-events"]
# `renox::fake`, for factories with fake data.
fake = ["renox-core/fake"]
# `analytics::ServerEvent` (GA4 events sent from the server; brings an HTTP client).
server-events = ["renox-core/server-events"]
# S3-compatible storage (AWS S3, Cloudflare R2, MinIO) for `STORAGE_DISK=s3`.
s3 = ["renox-core/s3"]
# PostgreSQL databases (`DATABASE_URL=postgres://...`).
postgres = ["renox-core/postgres"]
# `uuid::Uuid` model fields (BLOB on SQLite, UUID on PostgreSQL).
uuid = ["renox-core/uuid"]

[dependencies]
renox-core.workspace = true
renox-macros.workspace = true
axum = "0.8.9"
tokio = { version = "1.53.1", features = ["full"] }

[dev-dependencies]
anyhow = "1.0.104"
futures-util = "0.3.34"
http-body-util = "0.1.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["io-util", "macros", "net", "rt-multi-thread"] }
tower = { version = "0.5.3", features = ["util"] }

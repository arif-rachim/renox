{% extends "renox/auth/layout.html" %}
{% block title %}{{ text.reset_title }} · {{ app.name }}{% endblock %}
{% block content %}
<form class="card" method="post" action="{{ route('password.update') }}" hx-post="{{ route('password.update') }}">
  {{ csrf_field() }}
  <input type="hidden" name="token" value="{{ token }}">
  <h2>{{ text.reset_title }}</h2>
  <label>{{ text.email }}
    <input type="email" name="email" value="{{ old('email', email) }}" autocomplete="username" required>
  </label>
  <p class="error" data-error-for="email">{{ error('email') }}</p>
  <label>{{ text.password }}
    <input type="password" name="password" autocomplete="new-password" required autofocus>
  </label>
  <p class="error" data-error-for="password">{{ error('password') }}</p>
  <label>{{ text.password_confirmation }}
    <input type="password" name="password_confirmation" autocomplete="new-password" required>
  </label>
  <button type="submit">{{ text.reset_button }}</button>
</form>
{% endblock %}

<!doctype html>
<html lang="{{ app.locale }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ app.name }}{% endblock %}</title>
  {{ renox_head() }}
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f5f5f4; color: #1c1917; font-family: system-ui, sans-serif; }
    .renox-auth { width: min(24rem, calc(100% - 2rem)); }
    .brand { text-align: center; font-size: 1.25rem; margin-bottom: 1rem; }
    .brand a { color: inherit; text-decoration: none; }
    .card { display: grid; gap: .75rem; background: #fff; padding: 1.5rem; border-radius: .75rem; box-shadow: 0 1px 3px rgb(0 0 0 / .1); }
    .card h2 { margin: 0 0 .25rem; font-size: 1.1rem; }
    label { display: grid; gap: .25rem; font-size: .9rem; }
    label.check { display: flex; gap: .5rem; align-items: center; }
    input:not([type=checkbox]) { font: inherit; padding: .55rem .7rem; border: 1px solid #d6d3d1; border-radius: .4rem; }
    [aria-invalid="true"] { border-color: #b91c1c; }
    button { font: inherit; padding: .6rem; border: 0; border-radius: .4rem; background: #1c1917; color: #fff; cursor: pointer; }
    .error { color: #b91c1c; font-size: .85rem; margin: -.4rem 0 0; }
    .error:empty { display: none; }
    .status { background: #ecfdf5; color: #065f46; padding: .6rem; border-radius: .4rem; margin: 0; }
    .alt { text-align: center; font-size: .9rem; margin: .25rem 0 0; }
    .card p { margin: 0; }
    .card form { display: grid; }
    button.link { background: none; color: #57534e; text-decoration: underline; padding: 0; }
    .stack { display: grid; gap: 1rem; }
    .danger button { background: #b91c1c; }
  </style>
</head>
<body>
  <main class="renox-auth">
    <p class="brand"><a href="/"><strong>{{ app.name }}</strong></a></p>
    {% block content %}{% endblock %}
  </main>
</body>
</html>

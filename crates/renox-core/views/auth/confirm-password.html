{% extends "renox/auth/layout.html" %}
{% block title %}{{ text.confirm_title }} · {{ app.name }}{% endblock %}
{% block content %}
<form class="card" method="post" action="{{ route('password.confirm') }}" hx-post="{{ route('password.confirm') }}">
  {{ csrf_field() }}
  <h2>{{ text.confirm_title }}</h2>
  <p>{{ text.confirm_intro }}</p>
  <label>{{ text.password }}
    <input type="password" name="password" autocomplete="current-password" required autofocus>
  </label>
  <p class="error" data-error-for="password">{{ error('password') }}</p>
  <button type="submit">{{ text.confirm_button }}</button>
</form>
{% endblock %}

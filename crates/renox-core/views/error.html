<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ status }} {{ reason }}</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 48rem; margin: 4rem auto; padding: 0 1rem; color: #222; }
    h1 { font-weight: 600; }
    pre { background: #f4f4f4; padding: 1rem; overflow: auto; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>{{ status }} · {{ reason }}</h1>
  {% if detail %}<pre>{{ detail }}</pre>{% endif %}
</body>
</html>

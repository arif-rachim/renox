[package]
name = "renox-core"
description = "Core of the Renox web framework: application builder, modules, config and errors."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
# S3-compatible storage (AWS S3, Cloudflare R2, MinIO) for `STORAGE_DISK=s3`.
s3 = ["dep:object_store"]
# PostgreSQL databases (`DATABASE_URL=postgres://...`).
postgres = ["sqlx/postgres"]
# `uuid::Uuid` model fields (BLOB on SQLite, UUID on PostgreSQL).
uuid = ["dep:uuid", "sqlx/uuid"]

[dependencies]
anyhow = "1.0.104"
argon2 = "0.6.0"
axum = { version = "0.8.9", features = ["multipart"] }
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
cookie = { version = "0.18.2", features = ["private", "key-expansion", "percent-encode"] }
dotenvy = "0.15.7"
fake = "5.1.0"
form_urlencoded = "1.2.2"
futures-util = "0.3.34"
hmac = "0.13.0"
http-body-util = "0.1.5"
lettre = { version = "0.11.23", default-features = false, features = ["builder", "smtp-transport", "pool", "hostname", "tokio1-rustls-tls"] }
minijinja = { version = "2.24.0", features = ["loader", "json", "urlencode"] }
minijinja-autoreload = "2.24.0"
multer = "3.1.0"
object_store = { version = "0.14.2", optional = true, default-features = false, features = ["aws"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "query"] }
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_path_to_error = "0.1.20"
serde_html_form = "0.2.8"
serde_urlencoded = "0.7.1"
sha2 = "0.11.0"
sqlx = { version = "0.9.0", default-features = false, features = ["sqlite", "runtime-tokio", "chrono", "json"] }
uuid = { version = "1", optional = true, features = ["v4", "serde"] }
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["full"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["cors", "fs", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
# Doc examples are written the way apps use Renox: through the `renox` crate.
renox = { path = "../renox" }
